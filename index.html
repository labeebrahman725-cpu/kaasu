$('#app').innerHTML=`<header><div class="logo">K</div><b>KAASU${S.name?' · '+esc(S.name):''}</b><input type="month" value="${V.m}" onchange="V.m=this.value||V.m;render()"><button onclick="go('settings')">⚙️</button></header><main>${views[V.tab]()}</main><nav>${N.map(n=>`<button class="${V.tab==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}<small>${n[2]}</small></button>`).join('')}</nav>`}
render();
</script></body></html>
